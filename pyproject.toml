[project]
name = "carrion"
version = "0.1.0"
description = "Phone-number and resume vetting toolkit"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.scripts]
carrion = "carrion.cli:main_lookup"
carrion-vet = "carrion.cli:main_vet"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carrion"]
